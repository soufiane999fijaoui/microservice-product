# =====================================================================
# Configuration du microservice-product
# Centralise les parametres de connexion pour faciliter le deploiement
# dans differents environnements (dev / test / prod).
# =====================================================================

# --- Source de donnees ---
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/product_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=

# --- Hibernate / JPA ---
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update

# --- Transaction ---
transaction.timeout=30
